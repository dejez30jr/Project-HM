<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Section</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0c1c36]">
    <!-- ====== section layanan/service ========== -->
    <section class="bg-[#0c1c36] min-h-screen py-[8%] p-6">
        <div class="lg:flex gap-2 grid grid-cols-1 relative">
            <!-- text bungkusan -->
            <div class="flex-1 pb-5">
                <h1 class="text-2xl ts-hidden md:text-[4rem] text-white leading-tight font-bold">Service We Provide To <br>
                    <span class="text-orange-400">Elevate Your Business</span>
                </h1>
            </div>
            <!-- img bungkusan -->
            <div class="">
                <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?q=80&w=800"
                    alt="Business Meeting" class="rounded-md shadow-lg w-full h-[200px] md:h-[500px] lg:w-[500px] object-cover">
            </div>

            <!-- Service Cards -->
            <div class="grid grid-cols-2 mt-[20px] md:grid-cols-4 md:bottom-[70px] left-0 gap-6 lg:absolute">
                <!-- Card 1 -->
                <div class="bg-white shadow-md hover:shadow-lg transition rounded-md p-6 flex flex-col items-center" style="box-shadow: 4px 4px #3e4d4f;">
                    <img src="https://img.icons8.com/ios-filled/50/0c1c36/news.png" class="w-12 h-12 mb-3"
                        alt="Publikasi">
                    <p class="text-[#0c1c36] font-semibold text-center">Publikasi Media Online</p>
                </div>

                <!-- Card 2 -->     
                <div class="bg-white shadow-md hover:shadow-lg transition rounded-md p-6 flex flex-col items-center" style="box-shadow: 4px 4px #3e4d4f;">
                    <img src="https://img.icons8.com/ios-filled/50/0c1c36/source-code.png" class="w-12 h-12 mb-3"
                        alt="Website">
                    <p class="text-[#0c1c36] font-semibold text-center">Jasa Pembuatan Website</p>
                </div>

                <!-- Card 3 -->
                <div class="bg-white shadow-md hover:shadow-lg transition rounded-md p-6 flex flex-col items-center" style="box-shadow: 4px 4px #3e4d4f;">
                    <img src="https://img.icons8.com/ios-filled/50/0c1c36/video.png" class="w-12 h-12 mb-3"
                        alt="Editing">
                    <p class="text-[#0c1c36] font-semibold text-center">Editing Video</p>
                </div>

                <!-- Card 4 -->
                <div class="bg-white shadow-md hover:shadow-lg transition rounded-md p-6 flex flex-col items-center" style="box-shadow: 4px 4px #3e4d4f;">
                    <img src="https://img.icons8.com/ios-filled/50/0c1c36/share-2.png" class="w-12 h-12 mb-3"
                        alt="Social Media">
                    <p class="text-[#0c1c36] font-semibold text-center">Social Media Management</p>
                </div>
            </div>
        </div>
    </section>
    <!-- ============ end ============ -->
</body>

</html>
